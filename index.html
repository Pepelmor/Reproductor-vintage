<button class="hs" id="be" style="left:187px;top:534px;width:40px;height:40px" aria-label="Volumen"></button>
<button class="hs" id="bl" style="left:629px;top:534px;width:40px;height:40px" aria-label="Lista"></button>
<div id="sk"><div id="th"></div></div>
</div></div>
<script>
const SC="user-read-playback-state user-modify-playback-state playlist-read-private";
const RU=location.origin+location.pathname,$=id=>document.getElementById(id),fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
let CID=localStorage.getItem("cid"),TK=JSON.parse(localStorage.getItem("tk")||"null"),dev=null,P=null,st=null,stT=0,mode=0,TR=[],note="",noteT=0;
$("ru").textContent=RU;
const msg=s=>{note=s;noteT=performance.now()};
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
async function login(){const ver=b64u(crypto.getRandomValues(new Uint8Array(48)));localStorage.setItem("ver",ver);const ch=b64u(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(ver)));location.href="https://accounts.spotify.com/authorize?"+new URLSearchParams({client_id:CID,response_type:"code",redirect_uri:RU,scope:SC,code_challenge_method:"S256",code_challenge:ch})}
async function tokenReq(p){const r=await fetch("https://accounts.spotify.com/api/token",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({client_id:CID,...p})});const j=await r.json();if(!j.access_token)throw j;TK={a:j.access_token,r:j.refresh_token||(TK&&TK.r),e:Date.now()+j.expires_in*1000-60000};localStorage.setItem("tk",JSON.stringify(TK))}
async function tok(){if(Date.now()>TK.e)await tokenReq({grant_type:"refresh_token",refresh_token:TK.r});return TK.a}
async function api(path,opt={}){const r=await fetch("https://api.spotify.com/v1"+path,{...opt,headers:{Authorization:"Bearer "+await tok(),"Content-Type":"application/json"}});if(r.status===204)return null;const j=await r.json().catch(()=>null);if(!r.ok)throw j||r.status;return j}
function showList(a){TR=a;const L=$("pl");L.innerHTML="";a.forEach((x,i)=>{const d=document.createElement("div");d.className="tr";const s=document.createElement("span"),m=document.createElement("i");s.textContent=x.name+" — "+x.artist;m.textContent=fmt(x.ms/1000);d.append(s,m);d.onclick=()=>playList(i);L.appendChild(d)})}
const norm=x=>x&&x.uri&&x.uri.startsWith("spotify:track")?{name:x.name,uri:x.uri,artist:(x.artists&&x.artists[0]&&x.artists[0].name)||"",ms:x.duration_ms||0}:null;
async function playList(i){if(!await wake())return;await pcall("PUT","/play?device_id="+dev,{uris:TR.map(x=>x.uri).slice(0,100),offset:{position:i}});setTimeout(poll,800)}
async function pcall(m,p,b){try{return await api("/me/player"+p,{method:m,body:b?JSON.stringify(b):undefined})}catch(e){const r=e&&e.error;msg(r&&r.reason==="NO_ACTIVE_DEVICE"?"Abre la app de Spotify":(r&&r.message)||"Error");return null}}
async function wake(){try{const d=await api("/me/player/devices"),l=(d&&d.devices)||[];if(!l.length){msg("Abre la app de Spotify");return false}dev=(l.find(x=>x.is_active)||l[0]).id;return true}catch(e){msg("No se encontró Spotify");return false}}
async function loadPl(){try{const j=await api("/me/playlists?limit=50");(j.items||[]).forEach(p=>{const o=document.createElement("option");o.value=p.id;o.textContent=p.name;$("ps").appendChild(o)})}catch(e){msg("No se pudieron cargar las playlists")}}
$("ps").onchange=async e=>{if(!e.target.value)return;try{const j=await api("/playlists/"+e.target.value+"/items?limit=50");showList((j.items||[]).map(z=>norm(z.item||z.track)).filter(Boolean))}catch(x){msg("Lista no disponible");showList([])}};
$("q").onkeydown=async e=>{if(e.key!=="Enter"||!e.target.value.trim())return;try{const j=await api("/search?type=track&limit=10&q="+encodeURIComponent(e.target.value));showList(j.tracks.items.map(norm).filter(Boolean))}catch(x){msg("Búsqueda no disponible")}};
async function poll(){try{const j=await api("/me/player");if(j&&j.item){st={paused:!j.is_playing,position:j.progress_ms,duration:j.item.duration_ms,track_window:{current_track:{name:j.item.name,artists:j.item.artists||[]}}};stT=performance.now()}else if(!j)st=null}catch(e){}}
function startPoll(){poll();setInterval(poll,3000)}
const pos=()=>st?Math.min(st.duration,st.paused?st.position:st.position+performance.now()-stT):0;
$("bpl").onclick=async()=>{if(st){const p=pos(),w=st.paused;st.position=p;st.paused=!w;stT=performance.now();await pcall("PUT",w?"/play":"/pause");setTimeout(poll,800)}else if(TR.length)playList(0)};
$("bs").onclick=async()=>{if(st){await pcall("PUT","/pause");await pcall("PUT","/seek?position_ms=0");setTimeout(poll,800)}};$("bn").onclick=async()=>{await pcall("POST","/next");setTimeout(poll,900)};$("bp").onclick=async()=>{await pcall("POST","/previous");setTimeout(poll,900)};
$("bv").onclick=()=>mode=(mode+1)%3;
$("vol").onchange=e=>pcall("PUT","/volume?volume_percent="+e.target.value);
for(let i=0;i<10;i++){const r=document.createElement("input");r.type="range";r.min=-10;r.max=10;r.value=0;r.setAttribute("aria-label","Banda "+(i+1));$("eq").appendChild(r)}
const tog=(a,b)=>{$(a).classList.toggle("on");$(b).classList.remove("on")};
$("bl").onclick=()=>tog("pp","pe");$("be").onclick=()=>tog("pe","pp");
const sk=$("sk");let dr=false;
const sset=e=>{if(!st)return;const r=sk.getBoundingClientRect();st.position=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*st.duration;stT=performance.now()};
sk.onpointerdown=e=>{dr=true;sk.setPointerCapture(e.pointerId);sset(e)};sk.onpointermove=e=>dr&&sset(e);sk.onpointerup=()=>{dr=false;st&&pcall("PUT","/seek?position_ms="+Math.round(st.position))};
addEventListener("keydown",e=>{if(e.code==="Space"&&e.target.tagName!=="INPUT"){e.preventDefault();$("bpl").onclick()}});
const c=$("viz"),g=c.getContext("2d"),N=44,v=new Array(N).fill(0);let last=performance.now(),ph=0;
function frame(n){const dt=Math.min(.1,(n-last)/1000);last=n;ph+=dt;const pl=st&&!st.paused;
 for(let i=0;i<N;i++){const tg=pl?Math.random()*(.3+.7*Math.sin(i/(N-1)*Math.PI))*(.6+.4*Math.sin(ph*2+i)):0;v[i]+=(tg-v[i])*.25}
 g.fillStyle="rgba(0,0,0,.34)";g.fillRect(0,0,505,370);g.lineCap="round";
 if(mode===0){for(let i=0;i<N;i++){const a=Math.PI*(1.04+.92*i/(N-1)),l=26+v[i]*260;g.strokeStyle="hsl("+(190-i*4)+",90%,60%)";g.lineWidth=5;g.beginPath();g.moveTo(252+Math.cos(a)*20,330+Math.sin(a)*20);g.lineTo(252+Math.cos(a)*l,330+Math.sin(a)*l);g.stroke()}}
 else if(mode===1){const w=505/N;for(let i=0;i<N;i++){const h=v[i]*320;g.fillStyle="hsl("+(120-i*3)+",90%,55%)";g.fillRect(i*w+1,366-h,w-2,h)}}
 else{g.strokeStyle="#7dff3a";g.lineWidth=3;g.beginPath();for(let x=0;x<=505;x+=5){const k=Math.min(N-1,x/505*N|0),y=185+Math.sin(x/14+ph*6)*v[k]*150;x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}
 g.font="bold 15px Tahoma,Verdana,sans-serif";g.fillStyle="#9dff4a";g.textAlign="left";
 let ti=st&&st.track_window.current_track,txt=ti?(pl?"▶ ":"❚❚ ")+ti.name+" — "+ti.artists.map(a=>a.name).join(", "):"Elige una canción en la lista";
 if(performance.now()-noteT<4000)txt=note;g.fillText(txt.slice(0,48),14,26);
 if(st){g.textAlign="right";g.fillText(fmt(pos()/1000)+" / "+fmt(st.duration/1000),491,350)}
 $("th").style.left=(st?pos()/st.duration*(378-26):0)+"px";
 requestAnimationFrame(frame)}
function fit(){const s=Math.min(innerWidth/812,innerHeight/938,1.5),w=$("wrap");$("st").style.transform="scale("+s+")";w.style.width=812*s+"px";w.style.height=938*s+"px"}
addEventListener("resize",fit);fit();requestAnimationFrame(frame);if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
$("go").onclick=()=>{const v=$("cid").value.trim();if(v){localStorage.setItem("cid",v);CID=v;login()}};
(async()=>{const code=new URLSearchParams(location.search).get("code");
 try{if(code&&CID){await tokenReq({grant_type:"authorization_code",code,redirect_uri:RU,code_verifier:localStorage.getItem("ver")});history.replaceState({},"",RU)}}catch(e){msg("Error de autenticación")}
 if(TK&&CID){$("pc").style.display="none";$("pp").classList.add("on");startPoll();loadPl()}else $("pc").classList.add("on")})();
</script>
</body>
</html>
